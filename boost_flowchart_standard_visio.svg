<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2440" viewBox="0 0 1400 2440">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111111"/>
    </marker>
    <style>
      .shape { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
      .line { fill: none; stroke: #111111; stroke-width: 2.2; marker-end: url(#arrow); }
      .txt { font-family: Arial, sans-serif; font-size: 20px; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
      .small { font-size: 18px; }
      .yes { font-size: 18px; font-weight: 600; fill: #0b8043; }
      .no { font-size: 18px; font-weight: 600; fill: #c5221f; }
    </style>
  </defs>

  <!-- Terminator: Start -->
  <rect class="shape" x="560" y="20" width="280" height="70" rx="35" ry="35"/>
  <text class="txt" x="700" y="55">Start</text>

  <!-- Input / Output -->
  <polygon class="shape" points="445,120 955,120 925,190 415,190"/>
  <text class="txt small" x="685" y="155">Read Vpv, Vbat, Ibatt (raw + filt)</text>

  <!-- Process -->
  <rect class="shape" x="440" y="220" width="520" height="64"/>
  <text class="txt small" x="700" y="252">I_use = max(abs(Ibatt_filt), abs(Ibatt_raw))</text>

  <rect class="shape" x="440" y="320" width="520" height="64"/>
  <text class="txt small" x="700" y="352">Set base I_limit = 3.0A</text>

  <!-- Decision -->
  <polygon class="shape" points="700,410 880,470 700,530 520,470"/>
  <text class="txt small" x="700" y="470">Is Vbat near full zone?</text>

  <!-- Process (yes path) -->
  <rect class="shape" x="930" y="560" width="360" height="70"/>
  <text class="txt small" x="1110" y="588">Derate I_limit by Vbat bands</text>
  <text class="txt small" x="1110" y="612">(V1/V2/V3 -> A1/A2/A3)</text>

  <rect class="shape" x="440" y="670" width="520" height="64"/>
  <text class="txt small" x="700" y="702">over_current = I_use - I_limit</text>

  <!-- Decision -->
  <polygon class="shape" points="700,790 880,850 700,910 520,850"/>
  <text class="txt small" x="700" y="850">over_current > SOFT_MARGIN ?</text>

  <!-- Branch processes -->
  <rect class="shape" x="70" y="900" width="420" height="70"/>
  <text class="txt small" x="280" y="935">No current-based duty reduction</text>

  <rect class="shape" x="910" y="900" width="420" height="70"/>
  <text class="txt small" x="1120" y="930">Compute SOFT duty_down</text>
  <text class="txt small" x="1120" y="952">base + gain * over_current</text>

  <!-- Decision -->
  <polygon class="shape" points="700,1030 880,1090 700,1150 520,1090"/>
  <text class="txt small" x="700" y="1090">over_current > HARD_MARGIN ?</text>

  <rect class="shape" x="910" y="1180" width="420" height="70"/>
  <text class="txt small" x="1120" y="1210">Use HARD pullback</text>
  <text class="txt small" x="1120" y="1232">base_hard + gain_hard * over_current</text>

  <rect class="shape" x="440" y="1280" width="520" height="64"/>
  <text class="txt small" x="700" y="1312">If Vbat high, increase pullback strength</text>

  <rect class="shape" x="440" y="1380" width="520" height="64"/>
  <text class="txt small" x="700" y="1412">duty_accumulator = duty_accumulator - duty_down</text>

  <rect class="shape" x="440" y="1480" width="520" height="64"/>
  <text class="txt small" x="700" y="1512">Partial integral reset (anti-windup)</text>

  <!-- Decision -->
  <polygon class="shape" points="700,1570 880,1630 700,1690 520,1630"/>
  <text class="txt small" x="700" y="1622">System healthy and not hard-overlimit?</text>

  <rect class="shape" x="910" y="1720" width="420" height="70"/>
  <text class="txt small" x="1120" y="1748">Apply temporary minimum duty floor</text>
  <text class="txt small" x="1120" y="1770">(prevent instant drop to 0)</text>

  <!-- Connector -->
  <circle class="shape" cx="700" cy="1825" r="12"/>

  <rect class="shape" x="440" y="1885" width="520" height="64"/>
  <text class="txt small" x="700" y="1917">Apply next guardrails (Vpv / Vbat / duty ceiling)</text>

  <rect class="shape" x="440" y="1985" width="520" height="64"/>
  <text class="txt small" x="700" y="2017">Clamp duty to 0..MAX and dynamic ceiling</text>

  <!-- Output -->
  <polygon class="shape" points="445,2085 955,2085 925,2155 415,2155"/>
  <text class="txt small" x="685" y="2120">Write BOOST PWM</text>

  <!-- Decision -->
  <polygon class="shape" points="700,2170 880,2230 700,2290 520,2230"/>
  <text class="txt small" x="700" y="2230">Stay in BOOST mode?</text>

  <!-- Terminator: End -->
  <rect class="shape" x="560" y="2330" width="280" height="70" rx="35" ry="35"/>
  <text class="txt" x="700" y="2365">End</text>

  <!-- Main vertical lines -->
  <line class="line" x1="700" y1="90" x2="700" y2="120"/>
  <line class="line" x1="700" y1="190" x2="700" y2="220"/>
  <line class="line" x1="700" y1="284" x2="700" y2="320"/>
  <line class="line" x1="700" y1="384" x2="700" y2="410"/>
  <line class="line" x1="700" y1="530" x2="700" y2="670"/>
  <line class="line" x1="700" y1="734" x2="700" y2="790"/>
  <line class="line" x1="700" y1="910" x2="700" y2="1030"/>
  <line class="line" x1="700" y1="1150" x2="700" y2="1280"/>
  <line class="line" x1="700" y1="1344" x2="700" y2="1380"/>
  <line class="line" x1="700" y1="1444" x2="700" y2="1480"/>
  <line class="line" x1="700" y1="1544" x2="700" y2="1570"/>
  <line class="line" x1="700" y1="1837" x2="700" y2="1885"/>
  <line class="line" x1="700" y1="1949" x2="700" y2="1985"/>
  <line class="line" x1="700" y1="2049" x2="700" y2="2085"/>
  <line class="line" x1="700" y1="2155" x2="700" y2="2170"/>
  <line class="line" x1="700" y1="2290" x2="700" y2="2330"/>

  <!-- D1 branches -->
  <polyline class="line" points="880,470 900,470 900,595 930,595"/>
  <text class="yes" x="915" y="500">YES</text>
  <polyline class="line" points="1110,630 1110,702 700,702"/>
  <polyline class="line" points="700,702 700,670"/>
  <text class="no" x="650" y="560">NO</text>

  <!-- D2 branches -->
  <polyline class="line" points="520,850 490,850 490,935"/>
  <text class="no" x="455" y="850">NO</text>
  <polyline class="line" points="880,850 910,850 910,935"/>
  <text class="yes" x="940" y="850">YES</text>

  <!-- P5 to connector -->
  <polyline class="line" points="280,970 280,1825 688,1825"/>

  <!-- P6 to D3 -->
  <polyline class="line" points="1120,970 1120,1090 880,1090"/>

  <!-- D3 branches -->
  <polyline class="line" points="880,1090 910,1090 910,1215"/>
  <text class="yes" x="940" y="1090">YES</text>
  <text class="no" x="460" y="1090">NO</text>

  <!-- P7 to P8 -->
  <polyline class="line" points="910,1215 880,1215 880,1312 700,1312"/>
  <polyline class="line" points="700,1312 700,1280"/>

  <!-- D5 branches -->
  <polyline class="line" points="880,1630 910,1630 910,1755"/>
  <text class="yes" x="940" y="1630">YES</text>
  <polyline class="line" points="700,1690 700,1813"/>
  <text class="no" x="640" y="1690">NO</text>

  <!-- P11 to connector -->
  <polyline class="line" points="1120,1790 1120,1825 712,1825"/>

  <!-- D8 branches -->
  <polyline class="line" points="520,2230 350,2230 350,155 415,155"/>
  <text class="yes" x="400" y="2210">YES (loop)</text>
  <text class="no" x="760" y="2300">NO</text>
</svg>
