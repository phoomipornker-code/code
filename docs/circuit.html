<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <title>วงจรฟอร์เวิร์ดคอนเวอร์เตอร์</title>
  <style>
    body { font-family: "Noto Sans Thai", Sarabun, Tahoma, sans-serif; background: #efe8d8; color: #1b1b1b; margin: 0; }
    header { padding: 20px 32px 8px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p { margin: 0 0 12px; color: #5c564c; }
    figure { margin: 12px 24px 28px; background: #fff; border-radius: 12px; padding: 8px; box-shadow: 0 1px 0 #d4c7b0; }
    figcaption { padding: 8px 12px 12px; color: #4a4338; }
    object, img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <header>
    <h1>วงจรฟอร์เวิร์ดคอนเวอร์เตอร์</h1>
    <p>AC 240 V → DC 58 V / 5 A · single-switch + Nr · ETD49 · 67 kHz</p>
  </header>
  <figure>
    <object data="../artifacts/forward_schematic.svg" type="image/svg+xml">สคีมาติก</object>
    <figcaption>สคีมาติกกำลัง — อินพุต AC, Q1+RCD, หม้อแปลง 48:21:48, ทุติยภูมิ LC</figcaption>
  </figure>
  <figure>
    <object data="../artifacts/forward_on_off.svg" type="image/svg+xml">ON/OFF</object>
    <figcaption>ช่วง Q1 เปิด (ส่งพลังงานผ่าน D1) และ Q1 ปิด (D2 ฟรีวีล + Nr รีเซ็ตฟลักซ์)</figcaption>
  </figure>
  <figure>
    <object data="../artifacts/forward_waveforms.svg" type="image/svg+xml">คลื่น</object>
    <figcaption>คลื่นอุดมคติ CCM ที่ Vin = 340 V</figcaption>
  </figure>
</body>
</html>
